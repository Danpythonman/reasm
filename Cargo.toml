[package]
name = "reasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A fast, configurable formatter for assembly language (NASM)"
license = "MIT"
authors = ["Daniel Di Giovanni"]
readme = "README.md"
keywords = ["assembly", "nasm", "formatter", "x86"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
